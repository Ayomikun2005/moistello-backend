linters:
  disable-all: true
  enable:
    - gofmt
    - ineffassign
    - staticcheck

issues:
  exclude-rules:
    # Contributor test files with staticcheck warnings — not critical
    - path: tests/
      linters:
        - staticcheck
    - path: _test\.go
      linters:
        - staticcheck

  max-issues-per-linter: 0
  max-same-issues: 0
