linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gofmt

issues:
  exclude-rules:
    # Test files: unchecked Encode/Write in httptest handlers is fine
    - path: _test\.go
      linters:
        - errcheck
    # Test helpers: unchecked Load/Set are fine
    - path: config/config_test\.go
      linters:
        - errcheck

  # Don't fail on a few remaining warnings — let CI be green while code matures
  max-issues-per-linter: 0
  max-same-issues: 0

linters-settings:
  errcheck:
    exclude-functions:
      - (*sql.Tx).Rollback
      - (io.Closer).Close
      - (*net.Conn).SetReadDeadline
      - (*net.Conn).SetWriteDeadline
      - (*websocket.Conn).SetReadDeadline
      - (*websocket.Conn).SetWriteDeadline
      - (*websocket.Conn).WriteMessage
      - (*govalidator.Validate).RegisterValidation
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Fprint
